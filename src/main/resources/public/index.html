<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaVault — Personal Media Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="light-mode">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🎬</span>
      <span class="brand-name">MediaVault</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#/" class="nav-link" data-route="/">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <a href="#/movies" class="nav-link" data-route="/movies">
        <span class="nav-icon">🎥</span> Movies
      </a>
      <a href="#/tv" class="nav-link" data-route="/tv">
        <span class="nav-icon">📺</span> TV Shows
      </a>
      <a href="#/books" class="nav-link" data-route="/books">
        <span class="nav-icon">📚</span> Books
      </a>
      <a href="#/games" class="nav-link" data-route="/games">
        <span class="nav-icon">🎮</span> Games
      </a>
      <a href="#/lists" class="nav-link" data-route="/lists">
        <span class="nav-icon">📋</span> My Lists
      </a>
      <a href="#/tags" class="nav-link" data-route="/tags">
        <span class="nav-icon">🏷️</span> Tags
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </aside>

  <!-- Mobile Header -->
  <header class="mobile-header">
    <button class="hamburger" id="hamburger">☰</button>
    <span class="mobile-brand">🎬 MediaVault</span>
    <button class="theme-toggle-mobile" id="themeToggleMobile">🌙</button>
  </header>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div id="app"></div>
  </main>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
</body>
</html>
